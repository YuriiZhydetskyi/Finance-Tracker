<!--
  Summary shared component.

  Reads from the parent Alpine x-data:
    items:    array of item rows
    currency: ISO 4217 string ('EUR', 'UAH', ...)

  Uses helpers from shared/webapp.html: totalOrig, categoryBreakdown.
-->
<div class="card">
  <div class="totals">
    <span class="label">Загалом</span>
    <span class="big" :class="{ 'is-negative': totalOrig(items) < 0 }">
      <span class="amount" x-text="fmtMoney(totalOrig(items))"></span>
      <span class="currency" x-text="currency"></span>
    </span>
  </div>
  <div class="breakdown" x-show="items.length > 0">
    <template x-for="row in categoryBreakdown(items)" :key="row.category">
      <div class="breakdown-row" :class="{ 'is-negative': row.total < 0 }">
        <span x-text="row.category"></span>
        <span class="amount" x-text="fmtMoney(row.total) + ' ' + currency"></span>
      </div>
    </template>
  </div>
</div>
