name: Deploy

# Bypasses Cloudflare's broken GitHub-app UI. Three jobs run in order:
#   1. checks          — lint, typecheck, tests, Deno checks. No secrets.
#   2. deploy-backend  — Supabase migrations + Edge Functions. Runs in the
#                        `production` environment, which requires a manual
#                        approval in the Actions tab before it starts.
#   3. deploy-frontend — build + Cloudflare Pages. Waits for the backend, so
#                        the frontend can never be ahead of the database schema.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — `Account → Cloudflare Pages → Edit` API token.
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id.
#   VITE_SUPABASE_URL      — public; Vite inlines it into the bundle.
#   VITE_SUPABASE_ANON_KEY — public by design; RLS + JWT do authorization.
#
# `production` environment secrets (Settings → Environments → production),
# only exposed to deploy-backend after approval:
#   SUPABASE_ACCESS_TOKEN  — project-scoped CI token with an expiry date;
#                            only `supabase functions deploy` uses it.
#   SUPABASE_PROJECT_ID    — project ref.
#   SUPABASE_DB_PASSWORD   — database password; `supabase db push` connects
#                            with it directly through the session pooler.
#
# Setup and rotation: docs/deploy.md, section "Автодеплой бекенду".

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger via Actions tab

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # Dependency lifecycle scripts are not needed in CI (supabase binary
        # download, husky hooks); skipping them narrows supply-chain exposure.
        run: npm ci --ignore-scripts

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Typecheck Edge Functions
        run: |
          deno check supabase/functions/parse-receipt/index.ts
          deno check supabase/functions/process-receipt-imports/index.ts

      - name: Lint Edge Functions
        run: deno lint supabase/functions

      # `npm run test` runs this too; the dedicated step gives a clearer failure.
      - name: Check vendored domain copy
        run: npm run check:edge-domain

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          # env.ts validates VITE_* at module load. Some component tests
          # transitively import supabase-client (e.g. ItemRow → categories
          # barrel → useCategories) and fail to load without these. Tests
          # never reach Supabase — adapters are mocked via vi.mock.
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key-placeholder-not-used

  deploy-backend:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # Session pooler host from Dashboard → Connect; region-specific, not secret.
      SUPABASE_POOLER_HOST: aws-1-eu-central-1.pooler.supabase.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Keep in sync with the `supabase` devDependency in package-lock.json.
          version: 2.98.2

      # No `supabase link`: it fetches the revealed service_role key, which this
      # job must never hold. db push connects straight to Postgres through the
      # session pooler (GitHub runners have no IPv6 for the direct host).
      - name: Apply migrations
        run: |
          password="$(jq -rn --arg value "$SUPABASE_DB_PASSWORD" '$value | @uri')"
          db_url="postgresql://postgres.${SUPABASE_PROJECT_ID}:${password}@${SUPABASE_POOLER_HOST}:5432/postgres"
          echo "::add-mask::${password}"
          echo "::add-mask::${db_url}"
          supabase db push --db-url "$db_url" --yes

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy parse-receipt --project-ref "$SUPABASE_PROJECT_ID" --use-api --yes
          supabase functions deploy process-receipt-imports --project-ref "$SUPABASE_PROJECT_ID" --use-api --yes

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # Dependency lifecycle scripts are not needed in CI (supabase binary
        # download, husky hooks); skipping them narrows supply-chain exposure.
        run: npm ci --ignore-scripts

      - name: Build
        run: npm --workspace web run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=finance-tracker --branch=main
