name: Deploy

# Bypasses Cloudflare's broken GitHub-app UI. Three jobs run in order:
#   1. checks          — lint, typecheck, tests, Deno checks. No secrets.
#   2. deploy-backend  — Supabase migrations + Edge Functions. Runs in the
#                        `production` environment, which requires a manual
#                        approval in the Actions tab before it starts.
#   3. deploy-frontend — build + Cloudflare Pages. Waits for the backend, so
#                        the frontend can never be ahead of the database schema.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — `Account → Cloudflare Pages → Edit` API token.
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id.
#   VITE_SUPABASE_URL      — public; Vite inlines it into the bundle.
#   VITE_SUPABASE_ANON_KEY — public by design; RLS + JWT do authorization.
#
# `production` environment secrets (Settings → Environments → production),
# only exposed to deploy-backend after approval:
#   SUPABASE_ACCESS_TOKEN  — dedicated CI token with an expiry date.
#   SUPABASE_PROJECT_ID    — project ref for `supabase link`.
#   SUPABASE_DB_PASSWORD   — database password for `supabase db push`.
#
# Setup and rotation: docs/deploy.md, section "Автодеплой бекенду".

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger via Actions tab

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Edge Functions
        run: |
          deno check supabase/functions/parse-receipt/index.ts
          deno check supabase/functions/process-receipt-imports/index.ts

      - name: Lint Edge Functions
        run: deno lint supabase/functions

      # `npm run test` runs this too; the dedicated step gives a clearer failure.
      - name: Check vendored domain copy
        run: npm run check:edge-domain

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          # env.ts validates VITE_* at module load. Some component tests
          # transitively import supabase-client (e.g. ItemRow → categories
          # barrel → useCategories) and fail to load without these. Tests
          # never reach Supabase — adapters are mocked via vi.mock.
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key-placeholder-not-used

  deploy-backend:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Keep in sync with the `supabase` devDependency in package-lock.json.
          version: 2.98.2

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy parse-receipt --project-ref "$SUPABASE_PROJECT_ID" --use-api --yes
          supabase functions deploy process-receipt-imports --project-ref "$SUPABASE_PROJECT_ID" --use-api --yes

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm --workspace web run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=finance-tracker --branch=main
