name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        # Dependency lifecycle scripts are not needed in CI (supabase binary
        # download, husky hooks); skipping them narrows supply-chain exposure.
        run: npm ci --ignore-scripts

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Typecheck Edge Functions
        run: |
          deno check supabase/functions/parse-receipt/index.ts
          deno check supabase/functions/process-receipt-imports/index.ts
          deno check supabase/functions/ingest-email-receipts/index.ts

      - name: Lint Edge Functions
        run: deno lint supabase/functions

      # `npm run test` runs this too; the dedicated step gives a clearer failure.
      - name: Check vendored domain copy
        run: npm run check:edge-domain

      - name: Verify frozen taxonomy backfill
        run: node scripts/product-taxonomy/verify-historical-backfill.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key-placeholder-not-used
