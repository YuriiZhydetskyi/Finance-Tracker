name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Edge Functions
        run: |
          deno check supabase/functions/parse-receipt/index.ts
          deno check supabase/functions/process-receipt-imports/index.ts

      - name: Lint Edge Functions
        run: deno lint supabase/functions

      # `npm run test` runs this too; the dedicated step gives a clearer failure.
      - name: Check vendored domain copy
        run: npm run check:edge-domain

      - name: Verify frozen taxonomy backfill
        run: node scripts/product-taxonomy/verify-historical-backfill.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key-placeholder-not-used
