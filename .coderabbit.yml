# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: 'en-US'

reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  tools:
    eslint:
      enabled: false # ESLint runs in CI via pr-checks.yml — no need to duplicate

pre_merge_checks:
  docstrings:
    mode: 'off' # project convention: no docstrings in TypeScript code
