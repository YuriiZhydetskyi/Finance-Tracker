<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #d8dce0;
    --text: #1a1a1a;
    --muted: #6c7480;
    --accent: #2d6cdf;
    --accent-text: #ffffff;
    --danger: #c0392b;
    --success: #1f8b4c;
    --warn-bg: #fff5d6;
    --warn-text: #8a5a00;
    --radius: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
  }

  h1, h2, h3 { margin: 0 0 12px; font-weight: 600; }
  h1 { font-size: 20px; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; color: var(--muted); }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar a { color: var(--text); text-decoration: none; font-weight: 600; }
  .topbar .who { color: var(--muted); font-size: 14px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 0; }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }

  input, select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font: inherit;
    background: var(--surface);
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  button {
    padding: 10px 16px;
    border: 0;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
  }
  button:disabled { opacity: 0.55; cursor: progress; }
  button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  button.danger { background: var(--danger); }

  .pill-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 16px; }
  .pill-buttons a {
    display: block;
    padding: 22px 12px;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: var(--radius);
    text-align: center;
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
  }
  .pill-buttons a.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

  .item-row {
    display: grid;
    grid-template-columns: 2fr 1.4fr 0.8fr 0.9fr 36px;
    gap: 6px;
    align-items: end;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .item-row:last-child { border-bottom: 0; }
  .item-extras { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding-top: 4px; }
  .item-extras label { font-size: 11px; }
  .icon-btn { width: 36px; height: 36px; padding: 0; background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .icon-btn:hover { color: var(--danger); border-color: var(--danger); }

  .totals { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 12px; border-top: 2px solid var(--border); }
  .totals .big { font-size: 22px; font-weight: 700; }

  .breakdown { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .breakdown-row { display: flex; justify-content: space-between; }

  .receipt-list { list-style: none; padding: 0; margin: 0; }
  .receipt-list li { padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .receipt-list li:hover { background: var(--bg); }
  .receipt-list li:last-child { border-bottom: 0; }
  .receipt-list .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .err { background: #ffe1de; color: var(--danger); padding: 10px 12px; border-radius: var(--radius); margin: 10px 0; font-size: 14px; }
  .ok  { background: #e1f5ea; color: var(--success); padding: 10px 12px; border-radius: var(--radius); margin: 10px 0; font-size: 14px; }
  .warn { background: var(--warn-bg); color: var(--warn-text); padding: 10px 12px; border-radius: var(--radius); margin: 10px 0; font-size: 14px; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: var(--surface); padding: 20px; border-radius: var(--radius);
    width: min(420px, 90vw); box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }

  .loader { display: flex; align-items: center; gap: 10px; padding: 12px; color: var(--muted); }
  .loader::before {
    content: "";
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .add-link { background: transparent; color: var(--accent); padding: 6px 0; min-height: 0; font-weight: 500; }
  [x-cloak] { display: none !important; }
</style>
