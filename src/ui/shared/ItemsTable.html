<!--
  ItemsTable shared component.

  Reads from the parent Alpine x-data:
    items:         array (mutated in place via push/splice)
    categories:    array of category names
    products:      array of {id, name, category} (used for the "linked" pill)

  Uses helpers from shared/webapp.html: newItemRow, rowTotal.
  Pages embed via the shared/ItemsTable include scriptlet (see other pages).
-->
<div class="items-table">
  <template x-for="(it, idx) in items" :key="idx">
    <div class="card" style="padding:10px">
      <div class="item-row">
        <div>
          <label x-show="idx === 0">Товар</label>
          <input x-model="it.product_name" placeholder="Назва" list="products-datalist">
        </div>
        <div>
          <label x-show="idx === 0">Категорія</label>
          <select x-model="it.category">
            <option value="">—</option>
            <template x-for="c in categories" :key="c">
              <option :value="c" x-text="c"></option>
            </template>
          </select>
        </div>
        <div>
          <label x-show="idx === 0">К-сть</label>
          <input x-model.number="it.qty" type="number" step="0.001" min="0" inputmode="decimal">
        </div>
        <div>
          <label x-show="idx === 0">Ціна</label>
          <!-- No min="0": negative prices are valid for discounts, Pfand refunds, cancellations. -->
          <input x-model.number="it.unit_price_orig" type="number" step="0.01" inputmode="decimal">
        </div>
        <button type="button" class="icon-btn" title="Видалити рядок" @click="items.splice(idx, 1)">×</button>
      </div>
      <div class="item-extras">
        <div>
          <label>Хто</label>
          <select x-model="it.consumed_by">
            <option value="shared">Спільно</option>
            <option value="his">Він</option>
            <option value="hers">Вона</option>
            <option value="custom:30/70">30 / 70</option>
            <option value="custom:70/30">70 / 30</option>
            <option value="custom:50/50">50 / 50</option>
          </select>
        </div>
        <div>
          <label>Нотатка</label>
          <input x-model="it.note" placeholder="—">
        </div>
        <div>
          <label>Зіпсовано</label>
          <input x-model.number="it.wasted_qty" type="number" step="0.001" min="0" inputmode="decimal" placeholder="0">
        </div>
      </div>
      <div class="totals" style="margin-top:8px;padding-top:6px">
        <span style="color:var(--muted);font-size:13px">Рядок</span>
        <span :class="{ 'is-negative': rowTotal(it) < 0 }" x-text="fmtMoney(rowTotal(it))"></span>
      </div>
    </div>
  </template>
  <datalist id="products-datalist">
    <template x-for="p in products" :key="p.id">
      <option :value="p.name"></option>
    </template>
  </datalist>
  <button type="button" class="add-link" @click="items.push(newItemRow())">+ Додати товар</button>
</div>
