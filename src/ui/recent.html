<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finance Tracker</title>
  <base href="<?= scriptUrl ?>" target="_top">
  <meta name="finance-query-params" content="<?= JSON.stringify(queryParams || {}) ?>">
  <?!= include('shared/styles') ?>
  <?!= include('shared/webapp') ?>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body x-data="recentPage()" x-init="init()" x-cloak>
  <div class="topbar">
    <a href="?page=index">← На головну</a>
    <span class="who" x-text="currentEmail"></span>
  </div>

  <main>
    <h1>Останні чеки</h1>

    <template x-if="loading">
      <div class="loader">Завантажую...</div>
    </template>

    <template x-if="error">
      <div class="err" x-text="error"></div>
    </template>

    <template x-if="!loading && !error && receipts.length === 0">
      <div class="card empty-card">
        <div class="empty-line">Поки що порожньо.</div>
        <div>
          Додай перший чек з <a href="?page=photo">фото</a>
          або <a href="?page=manual">вручну</a>.
        </div>
      </div>
    </template>

    <ul class="receipt-list" x-show="!loading && receipts.length > 0">
      <template x-for="r in receipts" :key="r.id">
        <li @click="open(r.id)">
          <div class="receipt-head">
            <span class="receipt-store" x-text="r.store"></span>
            <span class="receipt-amount tabular">
              <span x-text="fmtMoney(r.total_eur)"></span><span class="currency">€</span>
            </span>
          </div>
          <div class="meta">
            <span x-text="r.date"></span>
            <template x-if="r.currency !== 'EUR'">
              <span> · <span x-text="fmtMoney(r.total_orig)"></span> <span x-text="r.currency"></span></span>
            </template>
            <template x-if="r.note">
              <span> · <em x-text="r.note"></em></span>
            </template>
          </div>
        </li>
      </template>
    </ul>
  </main>

  <script>
    function recentPage() {
      return {
        loading: true,
        error: '',
        receipts: [],
        currentEmail: '',

        async init() {
          this.currentEmail = await resolveUserEmail();
          try {
            this.receipts = await runServer('listRecent', [30]);
          } catch (e) {
            this.error = 'Не вдалося завантажити: ' + e.message;
          } finally {
            this.loading = false;
          }
        },

        open(id) { navigateTo('edit', { id: id }); },
        fmtMoney: fmtMoney,
      };
    }
  </script>
</body>
</html>
